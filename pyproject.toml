[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "2manifold-brownian-motion"
version = "0.1.0"
description = "Simulate and visualize Brownian motion on Riemannian manifolds (sphere, torus, Poincare disk)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
app = ["streamlit", "plotly"]

[project.urls]
Homepage = "https://github.com/jeanjacquesstleroux/2manifold-brownian-motion"

[tool.setuptools.packages.find]
include = ["src", "src.*"]
